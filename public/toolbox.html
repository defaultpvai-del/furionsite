<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FURION Toolbox</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}a{color:#65e5ed}p{color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}article{background:#151515;border:1px solid #333;border-radius:18px;padding:20px}input,textarea,select,button{font:inherit;width:100%;margin:6px 0;padding:12px;border:1px solid #444;border-radius:9px;background:#222;color:#fff}button{background:#65e5ed;color:#111;cursor:pointer;font-weight:bold}textarea{min-height:90px}output{display:block;overflow-wrap:anywhere;white-space:pre-wrap;color:#65e5ed;margin:12px 0}label{display:block;font-size:.9rem}</style></head><body><main><header><h1>FURION Toolbox</h1><a href="/">Voltar à FURION</a></header><p>Ferramentas gratuitas, diretamente no navegador. Versão inicial integrada.</p><div class="grid" id="grid"></div></main><script>const tools=[['Link WhatsApp',['Telefone com DDI e DDD','Mensagem'],v=>'https://wa.me/'+v[0].replace(/\D/g,'')+'?text='+encodeURIComponent(v[1])],['Link Instagram',['Usuário'],v=>'https://www.instagram.com/'+v[0].trim().replace(/^@/,'')+'/'],['Contador de texto',['Texto'],v=>v[0].length+' caracteres • '+(v[0].trim()?v[0].trim().split(/\s+/).length:0)+' palavras'],['Maiúsculas',['Texto'],v=>v[0].toUpperCase()],['Minúsculas',['Texto'],v=>v[0].toLowerCase()],['Remover espaços extras',['Texto'],v=>v[0].trim().replace(/\s+/g,' ')],['Codificar URL',['Texto'],v=>encodeURIComponent(v[0])],['Decodificar URL',['Texto'],v=>decodeURIComponent(v[0])],['Formatar JSON',['JSON'],v=>JSON.stringify(JSON.parse(v[0]),null,2)],['Centímetros para metros',['Centímetros'],v=>Number(v[0])/100+' m'],['Metros para centímetros',['Metros'],v=>Number(v[0])*100+' cm'],['Calculadora de porcentagem',['Valor','Porcentagem'],v=>Number(v[0])*Number(v[1])/100],['Desconto',['Preço','Desconto (%)'],v=>(Number(v[0])*(1-Number(v[1])/100)).toFixed(2)],['Custo de filamento 3D',['Peso em gramas','Preço por kg'],v=>'R$ '+(Number(v[0])*Number(v[1])/1000).toFixed(2)],['Gerador de senha',['Comprimento (8 a 128)'],v=>{let n=Math.max(8,Math.min(128,Number(v[0])||16)),chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&*';return Array.from(crypto.getRandomValues(new Uint32Array(n)),x=>chars[x%chars.length]).join('')}]];for(const [name,fields,fn] of tools){let card=document.createElement('article'),h=document.createElement('h2');h.textContent=name;card.append(h);let inputs=fields.map(f=>{let l=document.createElement('label');l.textContent=f;let i=document.createElement('textarea');l.append(i);card.append(l);return i});let b=document.createElement('button'),o=document.createElement('output'),c=document.createElement('button');b.textContent='Gerar resultado';c.textContent='Copiar';b.onclick=()=>{try{o.textContent=fn(inputs.map(i=>i.value))}catch(e){o.textContent='Entrada inválida'}};c.onclick=async()=>{try{await navigator.clipboard.writeText(o.textContent);c.textContent='Copiado!'}catch(e){c.textContent='Selecione o resultado para copiar'}};card.append(b,o,c);document.getElementById('grid').append(card)}</script></body></html>
