<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FURION Systems | Demonstração</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font:16px system-ui}main{max-width:1050px;margin:auto;padding:24px}header,nav,.metrics{display:flex;gap:12px;flex-wrap:wrap;align-items:center}header{justify-content:space-between}a{color:#65e5ed}button,input,select{font:inherit;padding:12px;border:1px solid #444;border-radius:10px;background:#202020;color:white}button{cursor:pointer}button.active{background:#65e5ed;color:#081519}article{background:#151515;border:1px solid #303030;border-radius:18px;padding:20px;margin:16px 0}.metrics article{flex:1;min-width:150px}.metrics strong{display:block;font-size:1.8rem;margin-top:8px}form{display:flex;flex-wrap:wrap;gap:10px}input{min-width:0;flex:1}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #333}.scroll{overflow:auto}small,p{color:#bbb}button:focus-visible,a:focus-visible{outline:2px solid #65e5ed}</style><main><header><h1>FURION Systems</h1><a href="/">Voltar ao site</a></header><p>Demonstração independente • Dados fictícios • Nenhuma cobrança real</p><nav><button id="os" class="active">FURION OS</button><button id="pay">FURION Pay</button></nav><div id="view"></div></main><script>let mode='os',orders=[{name:'Cliente Exemplo',service:'Impressão 3D',status:'Em produção'},{name:'Empresa Modelo',service:'Comunicação visual',status:'Concluído'}],payments=[{name:'Projeto exemplo',value:350,status:'Recebido'},{name:'Serviço exemplo',value:180,status:'Pendente'}];const el=id=>document.getElementById(id),money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){el('os').classList.toggle('active',mode==='os');el('pay').classList.toggle('active',mode==='pay');let isOS=mode==='os';el('view').innerHTML='<h2>'+(isOS?'Gestão de serviços':'Controle financeiro')+'</h2><div class="metrics"><article>'+ (isOS?'Ordens de serviço<strong>'+orders.length:'Recebido<strong>'+money(payments.filter(p=>p.status==='Recebido').reduce((s,p)=>s+p.value,0)))+'</strong></article><article>'+(isOS?'Concluídas<strong>'+orders.filter(p=>p.status==='Concluído').length:'Pendente<strong>'+money(payments.filter(p=>p.status==='Pendente').reduce((s,p)=>s+p.value,0)))+'</strong></article></div><article><h3>'+(isOS?'Nova ordem de serviço':'Novo lançamento simulado')+'</h3><form id="add"><input id="name" required placeholder="'+(isOS?'Cliente fictício':'Descrição')+'"><input id="detail" required '+(isOS?'placeholder="Serviço"':'type="number" min="0.01" step="0.01" placeholder="Valor em R$"')+'><button>Adicionar</button></form></article><article class="scroll"><table><thead><tr><th>Descrição</th><th>'+(isOS?'Serviço':'Valor')+'</th><th>Status</th><th>Ação</th></tr></thead><tbody>'+(isOS?orders:payments).map((p,i)=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(isOS?p.service:money(p.value))+'</td><td>'+esc(p.status)+'</td><td><button data-i="'+i+'">'+(isOS?'Concluir':'Simular recebimento')+'</button></td></tr>').join('')+'</tbody></table></article><small>Alterações temporárias, apagadas ao recarregar a página. Não informe dados reais.</small>';el('add').onsubmit=e=>{e.preventDefault();let name=el('name').value,detail=el('detail').value;if(isOS)orders.push({name,service:detail,status:'Em produção'});else payments.push({name,value:Number(detail),status:'Pendente'});render()};el('view').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{(isOS?orders:payments)[Number(b.dataset.i)].status=isOS?'Concluído':'Recebido';render()})}el('os').onclick=()=>{mode='os';render()};el('pay').onclick=()=>{mode='pay';render()};render();</script></html>
